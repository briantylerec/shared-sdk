openapi: 3.0.3
info:
  title: Shared Product Catalog API
  version: 1.0.0
  description: >-
    Stable cross-client contract for the sample catalog. Android, iOS, web, and
    backend teams can generate or implement clients from this schema. The Android
    lab currently adapts DummyJSON into this contract's domain model.
servers:
  - url: https://api.example.com
    description: Replace with the team's API gateway URL.
paths:
  /v1/products:
    get:
      operationId: listProducts
      summary: List products using offset pagination
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of items to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: skip
          in: query
          required: false
          description: Number of items to skip before returning results.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Page of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          description: Invalid pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ProductPage:
      type: object
      required: [items, total, limit, skip]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        skip:
          type: integer
          minimum: 0
    Product:
      type: object
      required: [id, title, description, price]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          minLength: 1
        description:
          type: string
        price:
          type: number
          format: double
          minimum: 0
        thumbnail:
          type: string
          format: uri
          nullable: true
        category:
          type: string
          nullable: true
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
          nullable: true
